
   <div class="container mt-5">
    <div class="row text-center d-flex flex-row justify-centent-start">
      <div class="col-6 mx-0 px-0">
        <mat-paginator
          class="pagination shadow"
          [length]="totalEntriesCount"
          [pageSize]="pageSize"
          [pageIndex]="pageIndex"
          [pageSizeOptions]="[5, 10, 20, 50]"
          aria-label="Select page"
          (page)="onPageEvent($event)">
        </mat-paginator>
      </div>
      <div class="col-md-5 d-flex px-0  ">
        <input
          type="number"
          [min]="1"
          [max]="maxPage"
          [(ngModel)]="pageInput"
          placeholder="Page"
          (keyup.enter)="goToPage()"
          class="form-control go-input text-center me-2" />
        <button class="btn btn-primary go-btn" (click)="goToPage()">GO</button>
        <div *ngIf="errorMsg" class="error-message text-danger">
          {{ errorMsg }}
        </div>
      </div>
    </div>
  </div>
